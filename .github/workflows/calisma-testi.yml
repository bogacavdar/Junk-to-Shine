name: Calisma testi (shader ve betik hatalari)

# Oyunu yazilimla calisan ekran karti (Mesa lavapipe / llvmpipe) uzerinde birkac saniye acar,
# shader ve betik hatalarini yakalar. Ekran karti olmadigi icin yavas ama hatalari gosterir.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calistir:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Yazi tiplerini indir (Space Grotesk, Inter - OFL)
        run: |
          mkdir -p assets/fonts
          for f in "SpaceGrotesk-Variable.ttf|https://github.com/google/fonts/raw/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" "Inter-Variable.ttf|https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf"; do
            n="${f%%|*}"; u="${f#*|}"
            (curl -fsSL -o "assets/fonts/$n" "$u" || wget -q -O "assets/fonts/$n" "$u")
          done
          ls -la assets/fonts
      - name: Yazilim ekran karti kur
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri libglx-mesa0 libegl1 > /dev/null
      - name: Projeyi ice aktar
        run: godot --headless --import > import.log 2>&1 || true
      - name: Ekran goruntuleri al
        run: |
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver vulkan --windowed --resolution 1280x720 res://test/ui_onizleme.tscn -- --ekran=/tmp/ekran > shot.log 2>&1 || true
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver vulkan --windowed --resolution 1280x720 res://test/cimen_onizleme.tscn -- --ekran=/tmp/ekran >> shot.log 2>&1 || true
          grep -v "Parameter \"version\" is null" shot.log | tail -40
          ls -la /tmp/ekran || true
      - uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri
          path: /tmp/ekran/*.png
          if-no-files-found: warn
      - name: Ekran goruntulerini ekran-goruntuleri dalina gonder
        if: always()
        run: |
          [ -d /tmp/ekran ] || exit 0
          rm -rf /tmp/egit && mkdir /tmp/egit && cp /tmp/ekran/*.png /tmp/egit/ 2>/dev/null || exit 0
          cd /tmp/egit
          git init -q -b ekran
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Ekran goruntuleri ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ekran:ekran-goruntuleri
      - name: Forward+ (Vulkan, lavapipe) ile calistir
        run: |
          timeout 150 xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver vulkan --quit-after 400 > vulkan.log 2>&1 || true
          grep -v "Parameter \"version\" is null" vulkan.log | head -200
      - name: Uyumluluk (OpenGL) ile calistir
        run: |
          timeout 150 xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --quit-after 400 > gl.log 2>&1 || true
          cat gl.log | head -300
      - name: Hata ozeti
        run: |
          echo "==== VULKAN ===="; grep -n -A4 -E "SHADER ERROR|SCRIPT ERROR|ERROR:" vulkan.log | head -120 || true
          echo "==== OPENGL ===="; grep -n -A4 -E "SHADER ERROR|SCRIPT ERROR|ERROR:" gl.log | head -120 || true
