name: Windows derlemesi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Export sablonlarini yerlestir
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Projeyi ice aktar ve betikleri kontrol et
        run: |
          godot --headless --import > import.log 2>&1 || true
          cat import.log
          if grep -q "SCRIPT ERROR" import.log; then echo "Betik hatasi var, derleme durduruldu."; exit 1; fi

      - name: Windows icin derle
        run: |
          mkdir -v -p build/windows
          godot --headless --verbose --export-release "Windows" build/windows/JunkToShine.exe
          ls -la build/windows
          test -s build/windows/JunkToShine.exe

      - name: Zip'le
        run: |
          apt-get update -qq && apt-get install -y -qq zip > /dev/null
          cd build/windows && zip -r ../JunkToShine-Windows.zip .

      - name: Surumu yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Junk to Shine - derleme ${{ github.run_number }}"
          body: "Otomatik Windows derlemesi. Zip'i ac, JunkToShine.exe'yi calistir."
          files: build/JunkToShine-Windows.zip
          make_latest: true
